name: 自动部署到 Vercel

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: 检查并部署
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.8.0"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码检查
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 拉取生产部署配置
        if: github.ref == 'refs/heads/main'
        run: npx vercel@53.0.1 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: 拉取预览部署配置
        if: github.ref != 'refs/heads/main'
        run: npx vercel@53.0.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: 构建生产部署产物
        if: github.ref == 'refs/heads/main'
        run: npx vercel@53.0.1 build --prod --token="$VERCEL_TOKEN"

      - name: 构建预览部署产物
        if: github.ref != 'refs/heads/main'
        run: npx vercel@53.0.1 build --token="$VERCEL_TOKEN"

      - name: 发布生产环境
        if: github.ref == 'refs/heads/main'
        run: npx vercel@53.0.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: 发布预览环境
        if: github.ref != 'refs/heads/main'
        run: npx vercel@53.0.1 deploy --prebuilt --token="$VERCEL_TOKEN"
